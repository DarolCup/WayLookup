name: release
# Builds packages when the version changes on main. Publishes the source distribution and
# Fedora RPMs to GitHub Releases. The wheel and Arch package remain workflow artifacts.
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - packaging/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" > /dev/null; then
            echo "Tag v$VER already exists"
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then build=true; else build=false; fi
          else
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  dist:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build Pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  rpm:
    needs: [version, dist]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: [43, 44, 45]
    container: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build RPM
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          dnf install -y rpm-build python3-devel python3-pillow pyproject-rpm-macros systemd-rpm-macros 'dnf-command(builddep)'
          TOP="$PWD/rpmbuild"
          mkdir -p "$TOP/SOURCES" "$TOP/SPECS" out
          cp "dist/waylookup-$VER.tar.gz" "$TOP/SOURCES/"
          sed "s/^Version:.*/Version:        $VER/" packaging/waylookup.spec > "$TOP/SPECS/waylookup.spec"
          status=0
          rpmbuild -br --define "_topdir $TOP" "$TOP/SPECS/waylookup.spec" || status=$?
          if [ "$status" = 11 ]; then
            dnf builddep -y "$TOP"/SRPMS/*.buildreqs.nosrc.rpm
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          rpmbuild -ba --define "_topdir $TOP" "$TOP/SPECS/waylookup.spec"
          cp "$TOP"/RPMS/noarch/*.rpm "$TOP"/SRPMS/*.src.rpm out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.fedora }}
          path: out/*

  arch:
    needs: [version, dist]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build Arch package
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          pacman -Syu --noconfirm --needed base-devel python python-build python-installer python-pillow python-setuptools python-wheel
          useradd -m builder
          mkdir -p archbuild out
          cp "dist/waylookup-$VER.tar.gz" archbuild/
          sed "s/^pkgver=.*/pkgver=$VER/" packaging/PKGBUILD > archbuild/PKGBUILD
          chown -R builder archbuild
          su builder -c 'cd archbuild && makepkg -f --nodeps'
          cp archbuild/*.pkg.tar.zst out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/*

  release:
    needs: [version, dist, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: rpms
          merge-multiple: true
      - name: Checksums and release notes
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p assets
          cp "dist/waylookup-$VER.tar.gz" rpms/*.noarch.rpm assets/
          (cd assets && sha256sum *.tar.gz *.rpm)
          awk -v ver="$VER" '$0 == "## " ver {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Как установить

          **Fedora (KDE Plasma / GNOME)** — проще всего скриптом:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/DarolCup/WayLookup/main/install-fedora.sh | bash
          ```

          Или скачайте RPM с суффиксом вашей Fedora (`.fc43`, `.fc44` или `.fc45`)
          и установите его через `sudo dnf install ./имя-пакета.rpm`.
          Если WayLookup уже установлен через скрипт, обновитесь тем же скриптом.

          **Исходники:** архив `waylookup-<версия>.tar.gz` содержит исходный код и файлы сборки.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: WayLookup ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: assets/*
          prerelease: ${{ contains(needs.version.outputs.version, 'b') || contains(needs.version.outputs.version, 'rc') }}
